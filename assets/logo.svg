<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <!-- Degradado moderno para el símbolo -->
    <linearGradient id="sonometaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
  </defs>

  <!-- ISOTIPO: Etiqueta + Onda de Sonido -->
  <g transform="translate(10, 10)">
    <!-- Silueta de Etiqueta (Tag) -->
    <path d="M 20 50 L 45 20 L 80 20 A 10 10 0 0 1 90 30 L 90 70 A 10 10 0 0 1 80 80 L 45 80 Z" 
          fill="none" stroke="url(#sonometaGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Orificio de la etiqueta (Metadatos) -->
    <circle cx="75" cy="50" r="4" fill="url(#sonometaGrad)" />

    <!-- Barras de onda de sonido dentro del flujo -->
    <line x1="28" y1="42" x2="28" y2="58" stroke="url(#sonometaGrad)" stroke-width="3" stroke-linecap="round" />
    <line x1="36" y1="35" x2="36" y2="65" stroke="url(#sonometaGrad)" stroke-width="3.5" stroke-linecap="round" />
    <line x1="44" y1="28" x2="44" y2="72" stroke="url(#sonometaGrad)" stroke-width="4" stroke-linecap="round" />
    <line x1="52" y1="38" x2="52" y2="62" stroke="url(#sonometaGrad)" stroke-width="3.5" stroke-linecap="round" />
    <line x1="60" y1="44" x2="60" y2="56" stroke="url(#sonometaGrad)" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- LOGOTIPO (TEXTO) -->
  <text x="120" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="800" fill="url(#sonometaGrad)" letter-spacing="-0.5">
    Sono<tspan fill="url(#sonometaGrad)">meta v2.0</tspan>
  </text>
  
  <!-- Subtítulo / Descriptor de la Suite -->
  <text x="122" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#64748B" letter-spacing="3">
    AUDIO TAG SUITE
  </text>
</svg>
